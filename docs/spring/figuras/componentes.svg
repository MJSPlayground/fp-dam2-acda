<svg xmlns="http://www.w3.org/2000/svg" width="420" height="650" viewBox="0 0 420 650" role="img" aria-labelledby="t d"><title id="t">Componentes del catálogo Spring</title><desc id="d">El controlador depende de CatalogoService. Este utiliza ReglasCatalogo, EditorialService y repositorios. EditorialService también utiliza persistencia. ReglasCatalogo valida y no accede a la base de datos.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2563eb"/></marker></defs><rect width="420" height="650" rx="14" fill="#f1f5f9"/><g font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle"><g stroke="#94a3b8" stroke-width="2" fill="white"><rect x="65" y="24" width="290" height="62" rx="10"/><rect x="65" y="137" width="290" height="62" rx="10"/><rect x="25" y="273" width="175" height="96" rx="10"/><rect x="220" y="273" width="175" height="96" rx="10"/><rect x="65" y="442" width="290" height="62" rx="10"/><rect x="65" y="558" width="290" height="62" rx="10"/></g><text x="210" y="62">Controlador web preparado</text><text x="210" y="175">CatalogoService</text><text x="112" y="310">ReglasCatalogo</text><text x="112" y="344">Valida entradas</text><text x="307" y="310">EditorialService</text><text x="307" y="344">Editoriales</text><text x="210" y="480">Repositorios Spring Data</text><text x="210" y="596">MySQL</text></g><g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"><path d="M210 86 V130"/><path d="M155 199 V235 H112 V266"/><path d="M265 199 V235 H307 V266"/><path d="M65 167 H12 V473 H58"/><path d="M307 369 V435"/><path d="M210 504 V551"/></g></svg>
