<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">Organización del primer codelab de inventario</title>
  <desc id="desc">PrepararDatos crea la entrada. InventarioCodelab usa Files para recorrerla y ExportadorCsv para escribir el informe.</desc>
  <style>
    .box{fill:#f4faff;stroke:#1385bd;stroke-width:2}.green{fill:#f4fbef;stroke:#67be45}.text{fill:#17324a;font:600 16px system-ui,sans-serif}.small{fill:#36546b;font:13px system-ui,sans-serif}.arrow{fill:none;stroke:#35718e;stroke-width:2;marker-end:url(#a)}
    @media(prefers-color-scheme:dark){.box{fill:#173247}.green{fill:#1d3827}.text{fill:#f0f7fc}.small{fill:#d2e3ee}.arrow{stroke:#8bc6e5}}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#35718e"/></marker></defs>
  <rect class="green" x="25" y="25" width="200" height="72" rx="11"/><text class="text" x="42" y="54">PrepararDatos</text><text class="small" x="42" y="77">crea archivos de muestra</text>
  <rect class="box" x="280" y="25" width="210" height="98" rx="11"/><text class="text" x="297" y="55">InventarioCodelab</text><text class="small" x="297" y="78">main: reglas y recorrido</text><text class="small" x="297" y="101">ArchivoInventariado: fila</text>
  <rect class="green" x="540" y="25" width="190" height="72" rx="11"/><text class="text" x="557" y="54">ExportadorCsv</text><text class="small" x="557" y="77">guarda filas recibidas</text>
  <rect class="box" x="25" y="170" width="200" height="66" rx="11"/><text class="text" x="42" y="198">entrada/</text><text class="small" x="42" y="221">CSV y subdirectorios</text>
  <rect class="box" x="540" y="170" width="190" height="66" rx="11"/><text class="text" x="557" y="198">salida/</text><text class="small" x="557" y="221">copia e inventario.csv</text>
  <path class="arrow" d="M490 61h40"/><path class="arrow" d="M125 98v60"/><path class="arrow" d="M225 203h125v-70"/><path class="arrow" d="M635 98v60"/>
  <text class="small" x="270" y="174">Files.list / walkFileTree</text>
</svg>
