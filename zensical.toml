[project]
site_name = "MJS Playground · Acceso a Datos"
site_description = "Material de aprendizaje de Acceso a Datos para 2.º DAM"
site_author = "Mikel Aingeru Jorge Soteras"
site_url = "https://mjsplayground.github.io/fp-dam2-acda/"
copyright = "© Mikel Aingeru Jorge Soteras"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/colors.css", "stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]
nav = [
  { "Ficheros" = [
    "ficheros/index.md",
    { "1. Ficheros y directorios" = ["ficheros/rutas.md", "ficheros/gestion-recorrido.md", "ficheros/listar-recorrer.md", "ficheros/guiada-directorios.md"] },
    { "2. Texto y CSV" = ["ficheros/texto.md", "ficheros/csv.md", "ficheros/guiada-csv.md", "ficheros/practica-fusion-csv.md"] },
    { "3. XML" = ["ficheros/xml.md", "ficheros/guiada-xml-csv.md", "ficheros/practica-csv-xml.md"] },
    { "4. JSON" = ["ficheros/json.md", "ficheros/guiada-json-csv.md", "ficheros/practica-formatos-anidados.md"] },
    { "5. Binarios" = ["ficheros/binarios.md", "ficheros/guiada-binarios.md", "ficheros/practica-informe-binario.md"] },
    { "6. Transformación" = ["ficheros/transformacion.md", "ficheros/practica-conversor.md"] },
    { "Prácticas finales" = ["ficheros/final-clientes.md", "ficheros/final-inventario.md", "ficheros/final-gestor.md"] },
    { "Ampliación" = ["ficheros/ampliacion-streaming.md", "ficheros/ampliacion-watchservice.md", "ficheros/ampliacion-filechannel.md", "ficheros/ampliacion-escrituras-fiables.md"] },
  ] },
  { "Hibernate" = ["hibernate/index.md"] },
  { "Spring" = ["spring/index.md"] },
  { "JDBC" = ["jdbc/index.md"] },
  { "Firestore" = ["firestore/index.md"] },
  { "MongoDB" = ["mongodb/index.md"] },
  { "Ayuda" = ["ayuda/index.md", "ayuda/proyectos-maven.md"] },
]

[project.extra]
generator = false
author_email_work = "mjorgesote@educacion.navarra.es"
author_email_personal = "mjsplayground90@gmail.com"

[project.extra.pdf_titles]
ficheros = "Manejo de ficheros y directorios"
hibernate = "Herramientas de mapeo objeto-relacional (ORM) y JPA con Hibernate"
spring = "Acceso a datos mediante componentes (Spring)"
jdbc = "Conexiones a bases de datos relacionales (JDBC)"
firestore = "Bases de datos documentales con Cloud Firestore"
mongodb = "Bases de datos NoSQL con MongoDB"
ayuda = "Ayuda y herramientas"

[project.theme]
name = "material"
variant = "modern"
language = "es"
logo = "assets/branding/mjs-playground.svg"
favicon = "assets/branding/mjs-playground.svg"
features = [
  "navigation.tabs", "navigation.indexes", "navigation.top", "navigation.path", "navigation.footer",
  "toc.follow", "content.code.copy", "content.code.annotate",
  "content.tabs.link", "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
