[project]
site_name = "MJS Playground · Acceso a Datos"
site_description = "Material de aprendizaje de Acceso a Datos para 2.º DAM"
site_author = "Mikel Aingeru Jorge Soteras"
site_url = "https://mjsplayground.github.io/fp-dam2-acda/"
copyright = "© Mikel Aingeru Jorge Soteras"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/colors.css", "stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]
nav = [
  { "Ficheros" = [
    { "Ficheros" = "ficheros/index.md" },
    "ficheros/rutas.md", "ficheros/texto-csv.md", "ficheros/json.md", "ficheros/binarios.md",
    "ficheros/arquitectura.md", "ficheros/proyecto.md", "ficheros/practica-final.md",
    "ficheros/repaso.md", "ficheros/ampliacion.md",
  ] },
  { "Hibernate" = [
    { "Hibernate" = "hibernate/index.md" },
    "hibernate/arquitectura.md", "hibernate/configuracion.md", "hibernate/entidades.md",
    "hibernate/persistencia.md", "hibernate/relaciones.md", "hibernate/consultas.md",
    "hibernate/proyecto.md", "hibernate/practica-final.md", "hibernate/repaso.md", "hibernate/ampliacion.md",
  ] },
  { "Spring" = [
      { "Spring" = "spring/index.md" },
      "spring/componentes.md", "spring/configuracion.md", "spring/persistencia.md", "spring/servicios.md",
      "spring/transacciones.md", "spring/proyecto.md", "spring/practica-final.md", "spring/repaso.md", "spring/ampliacion.md",
    ] },
  { "JDBC" = [
    { "JDBC" = "jdbc/index.md" },
    "jdbc/conexiones.md", "jdbc/consultas.md", "jdbc/repositorios.md", "jdbc/transacciones.md",
    "jdbc/proyecto.md", "jdbc/practica-final.md", "jdbc/repaso.md", "jdbc/ampliacion.md",
  ] },
  { "Firestore" = [
    { "Firestore" = "firestore/index.md" },
    "firestore/documentos.md", "firestore/configuracion.md", "firestore/persistencia.md",
    "firestore/consultas.md", "firestore/rest.md", "firestore/proyecto.md",
    "firestore/practica-final.md", "firestore/repaso.md", "firestore/ampliacion.md",
  ] },
  { "MongoDB" = [
    { "MongoDB" = "mongodb/index.md" },
    "mongodb/documentos.md", "mongodb/configuracion.md", "mongodb/persistencia.md",
    "mongodb/consultas.md", "mongodb/atomicidad.md", "mongodb/proyecto.md",
    "mongodb/practica-final.md", "mongodb/repaso.md", "mongodb/ampliacion.md",
  ] },
  { "Ayuda" = ["ayuda/index.md", "ayuda/proyectos-maven.md", "ayuda/diagnostico.md", "ayuda/contenedores.md"] },
]

[project.extra]
generator = false
author_email_work = "mjorgesote@educacion.navarra.es"
author_email_personal = "mjsplayground90@gmail.com"

[project.extra.pdf_titles]
ficheros = "Manejo de ficheros y directorios"
hibernate = "Herramientas de mapeo objeto-relacional (ORM) y JPA con Hibernate"
spring = "Acceso a datos mediante componentes (Spring)"
jdbc = "Conexiones a bases de datos relacionales (JDBC)"
firestore = "Bases de datos documentales con Cloud Firestore"
mongodb = "Bases de datos NoSQL con MongoDB"
ayuda = "Ayuda y herramientas"

[project.theme]
name = "material"
variant = "modern"
language = "es"
logo = "assets/branding/mjs-playground.svg"
favicon = "assets/branding/mjs-playground.svg"
features = [
  "navigation.tabs", "navigation.indexes", "navigation.top", "navigation.path", "navigation.footer",
  "toc.follow", "content.code.copy", "content.code.annotate",
  "content.tabs.link", "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
