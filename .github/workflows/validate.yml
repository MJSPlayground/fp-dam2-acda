name: Validar y publicar Acceso a Datos

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fp-dam2-acda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-community-server@sha256:db3c73bd50998abdfe17c80755597fc9a0601dedef1dfb7812dbc4133fc63a08
        ports:
          - 27018:27017
        options: >-
          --tmpfs /data/db:rw,mode=1777
          --tmpfs /data/configdb:rw,mode=1777
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Probar proyectos Java
        run: |
          (cd proyectos/ficheros/codelab-inicial && ./mvnw test --batch-mode)
          (cd proyectos/ficheros/codelab-solucion && ./mvnw test --batch-mode)
          (cd proyectos/ficheros/inicial && ./mvnw test --batch-mode)
          (cd proyectos/ficheros/solucion && ./mvnw test --batch-mode)
          (cd proyectos/jdbc/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/jdbc/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/jdbc/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/jdbc/final-solucion && sh mvnw test --batch-mode)
          (cd proyectos/firestore/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/firestore/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/firestore/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/firestore/final-solucion && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/final-solucion && sh mvnw test --batch-mode)
      - name: Probar persistencia y atomicidad con MongoDB real
        env:
          MONGODB_URI: mongodb://127.0.0.1:27018/acda_mongodb_qa_ci?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000
        run: sh scripts/test_mongodb_real.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar pipelines e índices documentados de MongoDB
        run: python scripts/check_mongodb_examples.py --container "${{ job.services.mongodb.id }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar integración real con el emulador Firestore
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-acda-reservas --config proyectos/firestore/guiado-solucion/firebase.json "sh scripts/test_firestore_emulator.sh"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Instalar Chromium
        run: python -m playwright install --only-shell chromium
      - name: Construir web y PDF
        run: python scripts/export_pdfs.py
      - name: Empaquetar y verificar proyectos descargables
        run: |
          python scripts/package_projects.py
          python scripts/package_projects.py --check
          python scripts/test_project_packages.py
      - name: Probar navegación y menú de descargas
        run: python scripts/check_site_ui.py
      - name: Probar páginas y cuatro descargas de JDBC
        run: python scripts/check_jdbc_ui.py
      - name: Probar páginas y cuatro descargas de Firestore
        run: python scripts/check_firestore_ui.py
      - name: Probar páginas y cuatro descargas de MongoDB
        run: python scripts/check_mongodb_ui.py
      - name: Comprobar enlaces internos y proyectos
        run: python scripts/check_links.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio final con PDF a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
