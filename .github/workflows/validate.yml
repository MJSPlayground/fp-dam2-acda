name: Validar y publicar Acceso a Datos

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fp-dam2-acda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Probar proyectos Java
        run: |
          (cd proyectos/ficheros/inicial && ./mvnw test --batch-mode)
          (cd proyectos/ficheros/solucion && ./mvnw test --batch-mode)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Instalar Chromium
        run: python -m playwright install --only-shell chromium
      - name: Construir web y PDF
        run: python scripts/export_pdfs.py
      - name: Probar navegación y menú de descargas
        run: python scripts/check_site_ui.py
      - name: Comprobar enlaces internos y proyectos
        run: python scripts/check_links.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio final con PDF a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
