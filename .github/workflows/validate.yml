name: Validar y publicar Acceso a Datos

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fp-dam2-acda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: qa_root_local
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: biblioteca_guiado
          MYSQL_USER: acda
          MYSQL_PASSWORD: acda_local
        ports:
          - 3308:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,mode=1777
          --health-cmd "MYSQL_PWD=qa_root_local mysql --protocol=TCP -h 127.0.0.1 -u root -N -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      mongodb:
        image: mongo@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27018:27017
        options: >-
          --tmpfs /data/db:rw,mode=1777
          --tmpfs /data/configdb:rw,mode=1777
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verificar modo compatible de TCMalloc en CI
        run: |
          uname -r
          docker exec "${{ job.services.mongodb.id }}" mongosh --quiet --eval \
            'if (db.serverStatus().tcmalloc.usingPerCPUCaches !== false) quit(1); print(db.version())'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Probar proyectos Java
        run: |
          (cd proyectos/ficheros/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/ficheros/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/ficheros/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/ficheros/final-solucion && sh mvnw test --batch-mode)
          (cd proyectos/jdbc/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/jdbc/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/jdbc/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/jdbc/final-solucion && sh mvnw test --batch-mode)
          (cd proyectos/firestore/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/firestore/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/firestore/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/firestore/final-solucion && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/mongodb/final-solucion && sh mvnw test --batch-mode)
          (cd proyectos/hibernate/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/hibernate/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/hibernate/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/hibernate/final-solucion && sh mvnw test --batch-mode)
          (cd proyectos/spring/guiado-inicial && sh mvnw test --batch-mode)
          (cd proyectos/spring/guiado-solucion && sh mvnw test --batch-mode)
          (cd proyectos/spring/final-inicial && sh mvnw test --batch-mode)
          (cd proyectos/spring/final-solucion && sh mvnw test --batch-mode)
      - name: Probar comprobaciones de aprendizaje de Ficheros y JDBC
        run: sh scripts/test_learning_local.sh ficheros jdbc
      - name: Probar relaciones y transacciones con MySQL real
        env:
          QA_MYSQL_ADMIN_URL: jdbc:mysql://127.0.0.1:3308/mysql?serverTimezone=UTC
          QA_MYSQL_ADMIN_USER: root
          QA_MYSQL_ADMIN_PASSWORD: qa_root_local
        run: sh scripts/test_hibernate_real.sh
      - name: Probar servicios y transacciones Spring con MySQL real
        env:
          QA_MYSQL_ADMIN_URL: jdbc:mysql://127.0.0.1:3308/mysql?serverTimezone=UTC
          QA_MYSQL_ADMIN_USER: root
          QA_MYSQL_ADMIN_PASSWORD: qa_root_local
        run: sh scripts/test_spring_real.sh
      - name: Probar persistencia y atomicidad con MongoDB real
        env:
          MONGODB_URI: mongodb://127.0.0.1:27018/acda_mongodb_qa_ci?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000
        run: sh scripts/test_mongodb_real.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar pipelines e índices documentados de MongoDB
        run: python scripts/check_mongodb_examples.py --container "${{ job.services.mongodb.id }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar integración real con el emulador Firestore
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-acda-reservas --config proyectos/firestore/guiado-solucion/firebase.json "sh scripts/test_firestore_emulator.sh"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar lenguaje orientado al estudiante
        run: |
          python scripts/test_student_voice.py
          python scripts/check_student_voice.py
      - name: Instalar Chromium
        run: python -m playwright install --only-shell chromium
      - name: Construir web y PDF
        run: python scripts/export_pdfs.py
      - name: Comprobar texto público en HTML y PDF
        run: python scripts/check_student_voice.py --site --pdf
      - name: Empaquetar y verificar proyectos descargables
        run: |
          python scripts/package_projects.py
          python scripts/package_projects.py --check
          python scripts/test_project_packages.py
      - name: Probar navegación y menú de descargas
        run: python scripts/check_site_ui.py
      - name: Probar páginas y cuatro descargas de JDBC
        run: python scripts/check_jdbc_ui.py
      - name: Probar páginas y cuatro descargas de Ficheros
        run: python scripts/check_ficheros_ui.py
      - name: Probar páginas y cuatro descargas de Firestore
        run: python scripts/check_firestore_ui.py
      - name: Probar páginas y cuatro descargas de MongoDB
        run: python scripts/check_mongodb_ui.py
      - name: Probar páginas y cuatro descargas de Hibernate
        run: python scripts/check_hibernate_ui.py
      - name: Probar páginas y cuatro descargas de Spring
        run: python scripts/check_spring_ui.py
      - name: Comprobar enlaces internos y proyectos
        run: python scripts/check_links.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio final con PDF a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
