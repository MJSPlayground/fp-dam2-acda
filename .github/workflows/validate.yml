name: Validar Zensical y PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mjs-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Instalar Chromium
        run: python -m playwright install --only-shell chromium
      - name: Construir web y PDF
        run: python scripts/export_pdfs.py
      - name: Probar navegación y menú de descargas
        run: python scripts/check_site_ui.py
      - name: Guardar web compilada (sin publicar)
        uses: actions/upload-artifact@v4
        with:
          name: zensical-site-preview
          path: site/
          if-no-files-found: error
      - name: Guardar archivos PDF
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-pdf
          path: docs/descargas/*.pdf
          if-no-files-found: error
