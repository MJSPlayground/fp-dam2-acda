name: acda-biblioteca
services:
  mysql:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: qa_root_local
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER: acda
      MYSQL_PASSWORD: acda_local
      MYSQL_DATABASE: biblioteca_guiado
    volumes:
      - biblioteca-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-biblioteca.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -N -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  biblioteca-data:
