<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos::cabecera('Pedidos confirmados')}"></head><body><main><nav th:replace="~{fragmentos::nav}"></nav><h1>Pedidos confirmados</h1><div th:replace="~{fragmentos::aviso}"></div><p th:if="${#lists.isEmpty(pedidos)}">Todavía no hay pedidos.</p><article th:each="p:${pedidos}" class="aviso"><h2 th:text="${p.clave}"></h2><p th:text="${p.fecha}"></p><ul><li th:each="l:${p.lineas}" th:text="${l.cantidad}+' × '+${l.titulo}+' · '+${l.precioUnitario}+' €'"></li></ul><p>Subtotal <span th:text="${p.subtotal}"></span> · Descuento <span th:text="${p.descuento}"></span> · Total <strong th:text="${p.total}+' €'"></strong></p></article><footer th:replace="~{fragmentos::pie}"></footer></main></body></html>
