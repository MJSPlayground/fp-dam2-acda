<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos::cabecera('Servicios para el catálogo')}"></head><body><main><nav th:replace="~{fragmentos::nav}"></nav><header><h1>Libros</h1><a th:if="${puedeEditar}" class="button" th:href="@{/libros/nuevo}">Nuevo libro</a><form th:if="${puedeEditar}" th:action="@{/demo}" method="post" class="confirmar" data-confirmar="Solo prepara datos en una base vacía; no reemplaza tus cambios. ¿Continuar?"><button>Preparar demostración</button></form></header><div th:replace="~{fragmentos::aviso}"></div><form th:action="@{/libros}" method="get" class="filtros"><label>Título<input name="texto" th:value="${texto}" maxlength="120"></label><label>Editorial<select name="editorial"><option value="">Todas</option><option th:each="e:${editoriales}" th:value="${e.id}" th:text="${e.nombre}" th:selected="${editorialSeleccionada==e.id}"></option></select></label><button>Buscar</button><a th:href="@{/libros}">Quitar filtros</a></form><div class="tabla"><table><thead><tr><th>ISBN</th><th>Título</th><th>Editorial</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody><tr th:each="l:${libros}"><td th:text="${l.isbn}"></td><td th:text="${l.titulo}"></td><td th:text="${l.editorial}"></td><td th:text="${l.precio}+' €'"></td><td th:text="${l.stock}"></td><td><a th:if="${puedeEditar}" th:href="@{/libros/{id}/editar(id=${l.id})}">Editar</a><form th:if="${puedeEditar}" th:action="@{/libros/{id}/eliminar(id=${l.id})}" method="post" class="confirmar" data-confirmar="¿Eliminar este libro del catálogo?"><button>Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(libros)}"><td colspan="6">No hay libros para este filtro. Comprueba los avisos y crea primero una editorial.</td></tr></tbody></table></div><footer th:replace="~{fragmentos::pie}"></footer></main></body></html>
