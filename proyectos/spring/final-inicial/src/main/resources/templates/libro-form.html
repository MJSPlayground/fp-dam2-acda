<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos::cabecera('Editar libro')}"></head><body><main><nav th:replace="~{fragmentos::nav}"></nav><h1 th:text="${libroForm.id==null?'Nuevo libro':'Editar libro'}"></h1><form class="editor" th:action="@{/libros/guardar}" th:object="${libroForm}" method="post"><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{version}"><div class="errores" role="alert"><p th:each="error:${#fields.globalErrors()}" th:text="${error}"></p></div><label>ISBN (13 dígitos)<input th:field="*{isbn}" pattern="[0-9]{13}" required><span class="error" th:errors="*{isbn}"></span></label><label>Título<textarea th:field="*{titulo}" maxlength="120" required></textarea><span class="error" th:errors="*{titulo}"></span></label><label>Precio (€)<input th:field="*{precio}" type="number" min="0.01" max="10000" step="0.01" required><span class="error" th:errors="*{precio}"></span></label><label>Existencias<input th:field="*{stock}" type="number" min="0" th:max="${maxStock}" required><span class="error" th:errors="*{stock}"></span></label><label>Editorial<select th:field="*{editorialId}" required><option value="">Selecciona</option><option th:each="e:${editoriales}" th:value="${e.id}" th:text="${e.nombre}"></option></select><span class="error" th:errors="*{editorialId}"></span></label><button type="submit">Guardar libro</button><a th:href="@{/libros}">Cancelar</a></form><footer th:replace="~{fragmentos::pie}"></footer></main></body></html>
