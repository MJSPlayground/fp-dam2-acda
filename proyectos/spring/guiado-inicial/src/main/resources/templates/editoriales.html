<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos::cabecera('Editoriales')}"></head><body><main><nav th:replace="~{fragmentos::nav}"></nav><h1>Editoriales</h1><div th:replace="~{fragmentos::aviso}"></div><div class="tabla"><table><thead><tr><th>Nombre</th><th>Acciones</th></tr></thead><tbody><tr th:each="e:${editoriales}"><td th:text="${e.nombre}"></td><td><a th:if="${puedeEditar}" th:href="@{/editoriales/{id}/editar(id=${e.id})}">Editar</a><form th:if="${puedeEditar}" th:action="@{/editoriales/{id}/eliminar(id=${e.id})}" method="post" class="confirmar" data-confirmar="¿Eliminar esta editorial? Se rechaza si tiene libros vinculados."><button>Eliminar</button></form></td></tr></tbody></table></div><h2 th:if="${puedeEditar}" th:text="${editorialForm.id==null?'Nueva editorial':'Editar editorial'}"></h2><form th:if="${puedeEditar}" class="editor" th:action="@{/editoriales/guardar}" th:object="${editorialForm}" method="post"><input type="hidden" th:field="*{id}"><div class="errores" role="alert"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Nombre<textarea th:field="*{nombre}" maxlength="80" required></textarea><span class="error" th:errors="*{nombre}"></span></label><button>Guardar editorial</button><a th:href="@{/editoriales}">Cancelar edición</a></form><footer th:replace="~{fragmentos::pie}"></footer></main></body></html>
