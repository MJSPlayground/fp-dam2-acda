name: acda-spring
services:
  mysql:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: qa_root_local
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER: acda
      MYSQL_PASSWORD: acda_local
      MYSQL_DATABASE: spring_guiado
    volumes:
      - spring-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-catalogo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -N -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MYSQL_URL: jdbc:mysql://mysql:3306/spring_guiado?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: acda
      MYSQL_PASSWORD: acda_local
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  spring-data:
