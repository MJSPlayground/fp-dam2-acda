server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3309/spring_guiado?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=3000&socketTimeout=5000}
spring.datasource.username=${MYSQL_USER:acda}
spring.datasource.password=${MYSQL_PASSWORD:acda_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
catalogo.max-stock=1000
server.error.include-message=never
server.error.include-stacktrace=never
